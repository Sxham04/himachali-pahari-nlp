[project]
name = "reg-finetune"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "sacrebleu>=2.6.0",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.2",
    "torch>=2.11.0",
    "transformers>=5.19.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
